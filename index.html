<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LangGraph Universe — an interactive, 3D study guide to LangGraph, LangChain, agent architectures and patterns. For educational purposes only." />
    <title>LangGraph Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Watchdog: if the app never starts (e.g. a cached page points at files a newer
      // deploy replaced), reload once with a cache-busting query to fetch fresh HTML.
      setTimeout(function () {
        if (window.__lguBooted) return
        try {
          if (sessionStorage.getItem('lgu-watchdog')) return
          sessionStorage.setItem('lgu-watchdog', '1')
        } catch (e) {}
        var u = new URL(location.href)
        u.searchParams.set('v', Date.now())
        location.replace(u.toString())
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
